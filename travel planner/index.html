<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>여행 플래너</title>
<meta name="theme-color" content="#F2F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행 플래너">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- 첫 로딩 화면 (로그인 없음) -->
<div id="loading-screen" class="screen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 13.5L3 11l1.5-2 6.5 1L16 4.5 18.5 6l-3 6.5 4.5 3-2 1.5-5-2-3 4-1.5-1z"/>
      </svg>
    </div>
    <h1>여행 플래너</h1>
    <p id="loading-msg">불러오는 중…</p>
  </div>
</div>

<!-- 앱 본체 -->
<div id="app" class="hidden">
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21h-6v-6h-6v6H3z"/></svg>
      <span>홈</span>
    </button>
    <button data-tab="schedule">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>일정</span>
    </button>
    <button data-tab="budget">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg>
      <span>가계부</span>
    </button>
    <button data-tab="check">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
      <span>체크</span>
    </button>
    <button data-tab="docs">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 3h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      <span>보관함</span>
    </button>
  </nav>
</div>

<!-- 바텀시트 / 모달 -->
<div id="sheet-backdrop" class="hidden"></div>
<div id="sheet" class="hidden"></div>

<!-- 경로 상세 오버레이 -->
<div id="route-overlay" class="hidden"></div>

<!-- Firebase (설정이 없으면 사용되지 않음) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="./js/config.js"></script>
<script src="./js/store.js"></script>
<script src="./js/maps.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
